{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <h2><i class="fas fa-user-plus"></i> Register for Schedule Planner</h2>
    <form method="POST" action="{{ url_for('register') }}">
        <div class="form-group">
            <label for="name"><i class="fas fa-user"></i> Full Name</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="email"><i class="fas fa-envelope"></i> Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password"><i class="fas fa-lock"></i> Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="form-group">
            <label for="course"><i class="fas fa-graduation-cap"></i> Course</label>
            <select id="course" name="course" required>
                <option value="">Select your course</option>
                <option value="9th">9th</option>
                <option value="10th">10th</option>
                <option value="11th">11th</option>
                <option value="12th">12th</option>
                <option value="NEET">NEET</option>
                <option value="JEE">JEE</option>
                <option value="polytechnic">polytechnic</option>
                <option value="Engineering">Engineering</option>
                <option value="ITI">ITI</option>
                <option value="CA">CA</option>
                <option value="MBA/BBA">MBA/BBA</option>
                <option value="BSC/MSC">MSC/BSC</option>
                <option value="Medical">Medical</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Register</button>
    </form>
    <p class="form-footer">Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
</div>
{% endblock %}
